# ─────────────────────────────────────────────
# CeremonyConnect – application.properties
# Database: Microsoft SQL Server
# ─────────────────────────────────────────────

spring.application.name=CeremonyConnect

# ── SQL Server DataSource ─────────────────────
# SQL Server Express is running as SQLEXPRESS instance (not default instance)
# The instance name must be in the URL: localhost\SQLEXPRESS
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=CeremonyConnectDB;;encrypt=false;trustServerCertificate=true;integratedSecurity=false
spring.datasource.username=ceremony_user
spring.datasource.password=1234
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ── JPA / Hibernate ───────────────────────────
# NOTE: The schema is created by CeremonyConnectDB.sql (run in SSMS first).
# 1. STOP Hibernate from trying to create or update tables
spring.jpa.hibernate.ddl-auto=none

# 2. FORCE Hibernate to use the exact names you wrote in @Column(name="...")
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ── Server ────────────────────────────────────
server.port=8080

# ── File Upload ───────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads

# ── Jackson ───────────────────────────────────
spring.jackson.serialization.fail-on-empty-beans=false

# ── Logging ───────────────────────────────────
logging.level.com.ceremonyconnect=DEBUG
logging.level.org.springframework.security=INFO
